name: CI

on:
  pull_request:
    branches:
      - development
      - staging
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed modules
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      identity: ${{ steps.filter.outputs.identity }}
      notification: ${{ steps.filter.outputs.notification }}
      common: ${{ steps.filter.outputs.common }}
      root: ${{ steps.filter.outputs.root }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gateway:
              - 'api-gateway/**'
            identity:
              - 'identity-service/**'
            notification:
              - 'notification-service/**'
            common:
              - 'ems-common/**'
            root:
              - 'pom.xml'
              - '.editorconfig'
              - '.github/workflows/**'

  build:
    name: Build and verify
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # ems-common is a dependency of every service, so a change to it — or to
      # anything at the root — has to rebuild the whole reactor. Otherwise the
      # reactor is ems-common plus whichever services the PR touched.
      - name: Select reactor
        id: reactor
        env:
          GATEWAY: ${{ needs.changes.outputs.gateway }}
          IDENTITY: ${{ needs.changes.outputs.identity }}
          NOTIFICATION: ${{ needs.changes.outputs.notification }}
          COMMON: ${{ needs.changes.outputs.common }}
          ROOT: ${{ needs.changes.outputs.root }}
        run: |
          if [ "$ROOT" = "true" ] || [ "$COMMON" = "true" ]; then
            scope="all modules"
            args=""
          else
            # Accumulated rather than enumerated: one branch per service, not one
            # per combination of them.
            modules=""
            if [ "$GATEWAY" = "true" ]; then modules="$modules,api-gateway"; fi
            if [ "$IDENTITY" = "true" ]; then modules="$modules,identity-service"; fi
            if [ "$NOTIFICATION" = "true" ]; then modules="$modules,notification-service"; fi

            if [ -z "$modules" ]; then
              scope="nothing"
              args=""
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              scope="ems-common$modules"
              args="-pl ems-common$modules"
            fi
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "Building: $scope" >> "$GITHUB_STEP_SUMMARY"

      # Spotless is bound to the verify phase in the root pom, so a formatting
      # violation fails this step.
      - name: mvn clean verify
        if: steps.reactor.outputs.skip != 'true'
        run: mvn -B clean verify ${{ steps.reactor.outputs.args }}

      - name: No Java modules touched
        if: steps.reactor.outputs.skip == 'true'
        run: echo "No module sources changed — nothing to build."
