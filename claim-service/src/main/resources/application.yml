spring:
  application:
    name: claim-service
  profiles:
    active: development
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/claim_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    deserialization:
      accept-float-as-int: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
server:
  port: 8087
logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
ems:
  storage:
    enabled: ${STORAGE_ENABLED:true}
    endpoint: ${STORAGE_ENDPOINT:}
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    path-style-access: ${STORAGE_PATH_STYLE_ACCESS:false}
    allowed-origins: ${STORAGE_ALLOWED_ORIGINS:}
  claims:
    currency: ${CLAIM_CURRENCY:LKR}
