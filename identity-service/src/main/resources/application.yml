spring:
  application:
    name: identity-service
  profiles:
    active: development
  data:
    redis:
      # Holds RefreshTokenStore's rt:{userId}:{jti} keys. Every profile points at the
      # same two variables; only their values differ per environment.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    # The topology itself lives in ems-common; only where the broker is differs per
    # environment. Publisher confirms and returns are defaulted on by ems-common.
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: 8081

logging:
  pattern:
    # Injected into the console and file patterns by Spring Boot's logback defaults.
    correlation: "[%X{correlationId:-}] "

