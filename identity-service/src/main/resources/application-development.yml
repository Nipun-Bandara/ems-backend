spring:
  config:
    import: optional:file:./identity-service/.env.development[.properties],optional:file:.env.development[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 100
      minimum-idle: 30
      connection-init-sql: "SELECT 1"
      connection-test-query: "SELECT 1"

  flyway:
    enabled: true

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks the entities still match it.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

app:
  security:
    jwt:
      # Optional here only: with no keypair on disk the service generates an ephemeral one at
      # startup and logs a warning. The other profiles require both paths.
      private-key-path: ${JWT_PRIVATE_KEY_PATH:}
      public-key-path: ${JWT_PUBLIC_KEY_PATH:}
      expiration: ${JWT_EXPIRATION}
      refresh-expiration: ${JWT_REFRESH_EXPIRATION}