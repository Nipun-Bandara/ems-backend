spring:
  servlet:
    multipart:
      enabled: false
  application:
    name: employee-service
  profiles:
    active: development
  rabbitmq:
    # The topology itself lives in ems-common; only where the broker is differs per
    # environment. Publisher confirms and returns are defaulted on by ems-common.
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: 8083

logging:
  pattern:
    # Injected into the console and file patterns by Spring Boot's logback defaults.
    correlation: "[%X{correlationId:-}] "

ems:
  storage:
    enabled: true
    endpoint: ${STORAGE_ENDPOINT:}
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    path-style-access: ${STORAGE_PATH_STYLE_ACCESS:false}
    allowed-origins: ${STORAGE_ALLOWED_ORIGINS:http://localhost:3000}
