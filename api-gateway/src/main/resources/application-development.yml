spring:
  config:
    import: optional:file:./.env.development[.properties],optional:file:./api-gateway/.env.development[.properties]
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: identity-service
              uri: ${IDENTITY_SERVICE_URL}
              predicates:
                - Path=/api/auth/**, /api/users/**, /api/departments/**

app:
  security:
    jwt:
      # identity-service's JWK Set. The gateway fetches and caches it; there is no
      # shared secret to keep in step any more.
      jwks-uri: ${JWKS_URI}