spring:
  config:
    import: optional:file:./.env.staging[.properties],optional:file:./api-gateway/.env.staging[.properties]
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: identity-service
              uri: ${IDENTITY_SERVICE_URL}
              predicates:
                - Path=/api/auth/**, /api/users/**
            - id: org-service
              uri: ${ORG_SERVICE_URL}
              predicates:
                - Path=/api/org/**, /api/departments/**, /api/designations/**, /api/teams/**, /api/projects/**

            - id: employee-service
              uri: ${EMPLOYEE_SERVICE_URL}
              predicates:
                - Path=/api/employees/**

            - id: leave-service
              uri: ${LEAVE_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/leaves/**

            - id: recruitment-service
              uri: ${RECRUITMENT_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/api/recruitment/**

            - id: claim-service
              uri: ${CLAIM_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/claims/**
            - id: timesheet-service
              uri: ${TIMESHEET_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/timesheets/**

app:
  security:
    jwt:
      # identity-service's JWK Set. The gateway fetches and caches it; there is no
      # shared secret to keep in step any more.
      jwks-uri: ${JWKS_URI}
