spring:
  application:
    name: api-gateway
  profiles:
    active: development
  data:
    redis:
      # Holds RateLimitingFilter's shared counter. Every profile points at the same
      # two variables; only their values differ per environment.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

ems:
  messaging:
    # The gateway routes HTTP; it neither publishes nor consumes events. ems-common puts
    # spring-boot-starter-amqp on its classpath, so say so explicitly rather than leave a
    # broker connection configured for something that will never use it.
    enabled: false

logging:
  pattern:
    # Injected into the console and file patterns by Spring Boot's logback defaults.
    correlation: "[%X{correlationId:-}] "
